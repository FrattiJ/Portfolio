<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jacob Fratti</title>
    <meta name="description" content="Jacob Fratti: pricing and analytics. Experience, projects, skills and education." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#top" id="brand"></a>
        <nav aria-label="Sections">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#projects">Projects</a>
          <a href="#off-the-clock">Off the clock</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark"></button>
      </div>
    </header>

    <main id="main">
      <!-- Splash page -->
      <section class="splash panel" id="top">
        <canvas class="speedlines" id="speedlines" aria-hidden="true"></canvas>
        <div class="stamp" aria-hidden="true"></div>
        <div class="splash-text">
          <p class="caption-box" id="heroEyebrow"></p>
          <h1 id="heroName"></h1>
          <p class="bubble" id="heroTagline"></p>
        </div>
        <div class="splash-foot">
          <p class="narration" id="heroIntro"></p>
          <div class="hero-links" id="heroLinks"></div>
        </div>
      </section>

      <!-- The proof, as a strip -->
      <section class="strip" aria-label="Before and after">
        <figure class="proof" id="proof"></figure>
        <dl class="facts" id="heroStats"></dl>
      </section>

      <section class="chapter" id="about">
        <h2 class="sfx">About</h2>
        <div class="about" id="aboutBody"></div>
      </section>

      <section class="chapter" id="experience">
        <h2 class="sfx">Experience</h2>
        <div id="experienceBody"></div>
      </section>

      <section class="chapter" id="projects">
        <h2 class="sfx">Projects</h2>
        <div id="projectGroups"></div>
      </section>

      <section class="chapter split-chapter" id="skills">
        <div>
          <h2 class="sfx">Skills</h2>
          <div id="skillsBody"></div>
        </div>
        <div id="education">
          <h2 class="sfx">Education</h2>
          <div id="educationBody"></div>
        </div>
      </section>

      <section class="chapter offclock-chapter" id="off-the-clock">
        <div class="tracks" aria-hidden="true"></div>
        <div id="offClockBody"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p id="footerText"></p>
        <div id="footerLinks"></div>
      </div>
    </footer>

    <dialog class="modal" id="projectModal" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </dialog>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
