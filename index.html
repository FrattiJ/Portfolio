<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jacob Fratti</title>
    <meta name="description" content="Jacob Fratti: pricing and analytics. Experience, projects, skills and education." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#top" id="brand"></a>
        <nav aria-label="Sections">
          <a href="#about">About</a>
          <a href="#experience">Experience</a>
          <a href="#projects">Projects</a>
          <a href="#skills">Skills</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark"></button>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <div class="hero-text">
          <p class="eyebrow" id="heroEyebrow"></p>
          <h1 id="heroName"></h1>
          <p class="lede" id="heroTagline"></p>
          <p class="intro" id="heroIntro"></p>
          <div class="hero-links" id="heroLinks"></div>
        </div>
        <figure class="proof frame" id="proof"></figure>
        <dl class="facts" id="heroStats"></dl>
      </section>

      <section class="row" id="about">
        <h2 class="row-label">About</h2>
        <div class="row-body about" id="aboutBody"></div>
      </section>

      <section class="row" id="experience">
        <h2 class="row-label">Experience</h2>
        <div class="row-body" id="experienceBody"></div>
      </section>

      <section class="row" id="projects">
        <h2 class="row-label">Projects</h2>
        <div class="row-body" id="projectGroups"></div>
      </section>

      <section class="row" id="skills">
        <h2 class="row-label">Skills</h2>
        <div class="row-body" id="skillsBody"></div>
      </section>

      <section class="row" id="education">
        <h2 class="row-label">Education</h2>
        <div class="row-body" id="educationBody"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p id="footerText"></p>
        <div id="footerLinks"></div>
      </div>
    </footer>

    <dialog class="modal frame" id="projectModal" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </dialog>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
