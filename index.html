<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jacob Fratti | Pricing and Analytics</title>
    <meta name="description" content="Jacob Fratti: pricing and analytics. Experience, projects, skills and education." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jacob Fratti | Pricing and Analytics" />
    <meta property="og:description" content="I build the automation that replaces manual pricing work, and I measure what it saves." />
    <meta property="og:url" content="https://frattij.github.io/" />
    <meta property="og:image" content="https://frattij.github.io/assets/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jacob Fratti in brush lettering over manga focus lines, with four price stickers: 6 yrs, about 150 accounts, 6 hrs marked down to 1 min, and 1,800 SKUs." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e8e8e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/Dracutaz.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/MPLUS1-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Runs before first paint: apply the saved theme and arm the opening sequence.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("theme");
          if (t && /^[a-z0-9]+$/.test(t)) root.dataset.theme = t;
        } catch (e) {}
        root.classList.add("js");
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <!-- Shared ink filters: rough brush edges and torn paper. Decorative only. -->
    <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <filter id="rough" x="-6%" y="-30%" width="112%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.028 0.11" numOctaves="2" seed="11" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="tear" x="-2%" y="-80%" width="104%" height="260%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="3" seed="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="26" xChannelSelector="G" yChannelSelector="R" />
        </filter>
      </defs>
    </svg>

    <header class="top">
      <a class="brand" href="#top" id="brand" translate="no"></a>
      <nav class="sections" aria-label="Sections">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
      </nav>
      <button class="theme" id="paletteToggle" type="button" aria-label="Colour palette" aria-expanded="false" aria-controls="paletteMenu" title="Colour palette">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="8" height="8" fill="currentColor" />
          <rect x="13" y="3" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2.5" />
          <rect x="3" y="13" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2.5" />
          <rect x="13" y="13" width="8" height="8" fill="currentColor" />
        </svg>
      </button>
      <fieldset class="palette-menu" id="paletteMenu" hidden>
        <legend class="vh">Colour palette</legend>
      </fieldset>
    </header>

    <main id="main">
      <section class="hero" id="top" aria-labelledby="heroName">
        <svg class="focus" id="focusLines" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path fill="currentColor" />
        </svg>
        <div class="wrap hero-grid">
          <div class="hero-title">
            <h1 id="heroName" translate="no"></h1>
            <p class="cover-lines" id="heroMeta"></p>
          </div>
          <div class="caption">
            <p class="lede" id="heroTagline"></p>
            <p class="intro" id="heroIntro"></p>
            <div class="links" id="heroLinks"></div>
          </div>
          <dl class="stickers" id="heroStats"></dl>
        </div>
      </section>

      <section class="page" id="about" aria-labelledby="h-about">
        <div class="wrap">
          <header class="chapter">
            <h2 id="h-about">About</h2>
          </header>
          <div class="about" id="aboutBody"></div>
        </div>
      </section>

      <section class="page" id="experience" aria-labelledby="h-experience">
        <div class="wrap">
          <header class="chapter">
            <h2 id="h-experience">Experience</h2>
          </header>
          <div class="panels" id="experienceBody"></div>
        </div>
      </section>

      <section class="page night" id="projects" aria-labelledby="h-projects">
        <p class="sfx sfx-projects" lang="ja" aria-hidden="true">カタカタ</p>
        <div class="wrap">
          <header class="chapter">
            <h2 id="h-projects">Projects</h2>
            <p>Open any cover for the full write-up.</p>
          </header>
          <div id="projectGroups"></div>
        </div>
      </section>

      <section class="page" id="skills" aria-labelledby="h-skills">
        <div class="wrap">
          <header class="chapter">
            <h2 id="h-skills">Skills and education</h2>
          </header>
          <div class="split">
            <div class="kit" id="skillsBody"></div>
            <div class="school" id="educationBody"></div>
          </div>
        </div>
      </section>

      <noscript>
        <p class="noscript">This page is built in the browser. Turn on JavaScript to read it.</p>
      </noscript>
    </main>

    <footer class="colophon">
      <div class="wrap colophon-in">
        <p class="hand signoff">To be continued.</p>
        <p id="footerText"></p>
        <div class="colophon-links" id="footerLinks"></div>
        <p class="credit">
          Title lettering: Dracutaz by Dhabee Studio. Text: M PLUS 1. Notes: East Sea Dokdo.
        </p>
      </div>
    </footer>

    <dialog class="reader" id="projectModal" aria-labelledby="modalTitle">
      <button class="reader-close" id="modalClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" />
        </svg>
      </button>
      <div id="modalBody"></div>
    </dialog>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
