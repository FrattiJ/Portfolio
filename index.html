<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jacob Fratti</title>
    <meta name="description" content="Jacob Fratti: pricing and analytics. Experience, projects, skills and education." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="nav">
      <a class="brand" href="#top" id="brand"></a>
      <nav aria-label="Sections">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
        <span aria-hidden="true">&#9680;</span>
      </button>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <p class="eyebrow mono" id="heroEyebrow"></p>
        <h1 id="heroName"></h1>
        <p class="lede" id="heroTagline"></p>
        <p class="intro" id="heroIntro"></p>
        <div class="hero-links" id="heroLinks"></div>
        <dl class="stats" id="heroStats"></dl>
      </section>

      <section id="about">
        <div class="section-head">
          <h2><span class="num mono">01</span> About</h2>
        </div>
        <div class="about" id="aboutBody"></div>
      </section>

      <section id="experience">
        <div class="section-head">
          <h2><span class="num mono">02</span> Experience</h2>
        </div>
        <div class="resume" id="experienceBody"></div>
      </section>

      <section id="projects">
        <div class="section-head">
          <h2><span class="num mono">03</span> Projects</h2>
          <p>Select any card for the full write-up.</p>
        </div>
        <div id="projectGroups"></div>
      </section>

      <section id="skills">
        <div class="section-head">
          <h2><span class="num mono">04</span> Skills and education</h2>
        </div>
        <div class="split">
          <div class="skills" id="skillsBody"></div>
          <div class="resume" id="educationBody"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p id="footerText"></p>
      <div id="footerLinks"></div>
    </footer>

    <dialog class="modal" id="projectModal" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </dialog>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
